name: PHPStan

on:
  push:
  pull_request:

jobs:
  phpstan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pmmp/setup-php-action@3.2.0
        with:
          php-version: 8.4
          pm-version-major: 5
          install-path: ./bin
      - run: composer install --prefer-dist --no-interaction --ignore-platform-req=ext-webrtc
      - run: composer test
      - run: composer phpstan
